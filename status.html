<style>
  /* Pagina di stato: elenco semplice, un pallino colorato per servizio. */
  #statusSection{max-width:640px;margin:0 auto;padding:34px 20px 60px;}
  .status-list{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .status-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--void-2);}
  .status-dot{width:11px;height:11px;border-radius:50%;flex:none;}
  .status-dot.ok{background:#5fb98a;box-shadow:0 0 8px rgba(95,185,138,0.5);}
  .status-dot.warn{background:#e3c273;box-shadow:0 0 8px rgba(227,194,115,0.5);}
  .status-dot.bad{background:#e24b4a;box-shadow:0 0 8px rgba(226,75,74,0.5);}
  .status-row .tx{flex:1;min-width:0;}
  .status-row b{display:block;font-size:15px;color:var(--parchment);}
  .status-row small{display:block;font-size:11.5px;color:var(--parchment-dim);font-family:'Space Mono',monospace;margin-top:2px;}
  .status-row .word{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;flex:none;}
  .status-word-ok{color:#5fb98a;} .status-word-warn{color:#e3c273;} .status-word-bad{color:#e24b4a;}
  .status-empty,.status-loading{color:var(--parchment-dim);font-size:14px;margin-top:20px;}
  .status-overall{display:flex;align-items:center;gap:10px;margin-top:6px;font-family:'Space Mono',monospace;font-size:12px;color:var(--parchment-dim);}
</style>
</head>
<body>
<div id="app">
<div id="chrome-top-slot"></div>

  <section class="section ornate-divider" id="statusSection">
    <div class="section-head">
      <div class="section-eyebrow">Diagnostica pubblica</div>
      <h2>Stato del sito</h2>
      <p class="section-desc">Se qualcosa non funziona, controlla qui prima di scrivere — questa pagina la aggiorna a mano l'admin, non è automatica.</p>
    </div>
    <div class="status-overall" id="statusOverall"></div>
    <div class="status-list" id="statusList"><p class="status-loading">…</p></div>
  </section>

<div id="chrome-footer-slot"></div>
</div>
<div id="chrome-modals-slot"></div>
