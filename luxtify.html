<!-- style.css è iniettato da loader.js con la versione sempre aggiornata -->
<style>
  /* Stile specifico di questa pagina: identità Luxtify (oro su nero, logo dedicato) */
  body{background:radial-gradient(ellipse 900px 500px at 50% 0%,rgba(110,20,35,0.22),transparent 70%),#0b0607;margin:0;min-height:100vh;}
  #luxtifySection{max-width:520px;margin:0 auto;font-family:'Crimson Pro',serif;padding-bottom:90px;}
  .luxtify-header{padding:28px 20px 16px;text-align:center;}
  .luxtify-logo{width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;border:2px solid rgba(201,162,77,0.5);}
  .luxtify-wordmark{
    font-family:'Cinzel Decorative',serif;font-size:24px;letter-spacing:0.06em;margin:0;
    background:linear-gradient(90deg,#c9a24d,#e85d4a,#4a9eff,#c9a24d);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:luxtifyShift 6s ease-in-out infinite;
  }
  @keyframes luxtifyShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .luxtify-stats{color:#8a7a5e;font-size:11px;margin-top:4px;}
  .luxtify-notif-toggle{display:inline-flex;}
  .luxtify-search{margin:14px 20px;display:flex;align-items:center;gap:8px;background:rgba(201,162,77,0.08);border:1px solid rgba(201,162,77,0.3);border-radius:20px;padding:9px 16px;cursor:pointer;}
  .luxtify-search span{color:#8a7a5e;font-size:13px;}
  .luxtify-chips{display:flex;gap:8px;padding:0 20px 6px;overflow-x:auto;}
  .luxtify-chip{flex-shrink:0;border:1px solid rgba(201,162,77,0.3);color:#8a7a5e;border-radius:16px;padding:6px 14px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .luxtify-chip.active{border-color:#c9a24d;color:#c9a24d;}
  .luxtify-section{padding:0 20px 22px;}
  .luxtify-section-title{color:#8a7a5e;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;font-weight:600;}
  .luxtify-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;}
  .luxtify-inline-card{display:flex;align-items:center;gap:10px;background:rgba(201,162,77,0.06);border:1px solid rgba(201,162,77,0.15);border-radius:10px;padding:10px;cursor:pointer;}
  .luxtify-bottomnav{position:sticky;bottom:0;display:flex;justify-content:space-around;padding:14px 0 18px;border-top:1px solid rgba(201,162,77,0.25);background:#150d0e;max-width:520px;margin:0 auto;}
  .luxtify-navitem{display:flex;flex-direction:column;align-items:center;gap:5px;color:#5a4f3e;font-size:24px;line-height:1;cursor:pointer;background:none;border:none;padding:6px 10px;min-width:64px;}
  .luxtify-navitem span{font-size:11px;}
  .luxtify-navitem.active{color:#c9a24d;}
  .hidden{display:none !important;}
  .luxtify-minibar{position:fixed;left:0;right:0;bottom:72px;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;background:#1a1113;border-top:1px solid rgba(201,162,77,0.3);padding:8px 14px;cursor:pointer;z-index:50;}
  .luxtify-minibar img{width:34px;height:34px;border-radius:5px;object-fit:cover;flex-shrink:0;background:#150d0e;}
  .luxtify-minibar-info{flex:1;min-width:0;}
  .luxtify-minibar-title{color:#f0e4cd;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .luxtify-minibar-artist{color:#8a7a5e;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .luxtify-minibar button{background:none;border:none;color:#c9a24d;font-size:16px;flex-shrink:0;cursor:pointer;}
  .luxtify-fab{width:34px;height:34px;border-radius:50%;background:#6e1423;color:#f0e4cd;border:none;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .luxtify-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:400;display:flex;align-items:flex-end;justify-content:center;}
  .luxtify-popup-box{background:#150d0e;border:1px solid rgba(201,162,77,0.35);border-radius:14px 14px 0 0;padding:20px;width:100%;max-width:520px;box-sizing:border-box;}
  .luxtify-popup-box input[type="text"]{width:100%;box-sizing:border-box;margin-bottom:8px;background:#0b0607;border:1px solid rgba(201,162,77,0.3);border-radius:6px;color:#e0d4b8;padding:9px;font-size:13px;}
  .luxtify-popup-box input[type="file"]{width:100%;margin-bottom:8px;font-size:12px;color:#8a7a5e;}

  /* ============ DESKTOP / SCHERMI LARGI — layout stile Spotify ============
     Sotto i 900px resta il layout mobile (nav in basso, colonna centrale
     stretta). Da 900px in su: sidebar a sinistra fissa, contenuto che
     riempie tutto lo spazio orizzontale disponibile, righe che vanno a
     capo invece di scorrere, barra di riproduzione a tutta larghezza. */
  @media (min-width: 900px) {
    .luxtify-bottomnav{
      position:fixed;top:0;left:0;bottom:auto;right:auto;
      flex-direction:column;justify-content:flex-start;align-items:stretch;
      width:230px;height:100vh;max-width:none;margin:0;gap:6px;
      padding:24px 12px 90px;border-top:none;border-right:1px solid rgba(201,162,77,0.2);
      background:linear-gradient(180deg,#1a0f11,#150d0e);
      box-sizing:border-box;overflow-y:auto;
    }
    .luxtify-navitem{flex-direction:row;justify-content:flex-start;gap:14px;font-size:20px;padding:11px 14px;border-radius:8px;min-width:0;width:100%;box-sizing:border-box;}
    .luxtify-navitem span{font-size:14px;}
    .luxtify-navitem.active{background:rgba(201,162,77,0.12);}
    #luxtifySection{margin:0 0 0 230px;max-width:1100px;padding:0 0 110px;}
    .luxtify-header{text-align:left;padding:28px 36px 16px;}
    .luxtify-logo{margin:0 0 12px;}
    .luxtify-search{margin:0 36px 18px;max-width:420px;}
    .luxtify-chips{padding:0 36px 10px;}
    .luxtify-section{padding:0 36px 30px;}
    .luxtify-inline-card{max-width:460px;}
    .luxtify-row{flex-wrap:wrap;overflow-x:visible;gap:18px;}
    .luxtify-row > *{width:170px !important;}
    .luxtify-minibar{left:230px;right:0;bottom:0;max-width:none;margin:0;padding:12px 36px;}
    .luxtify-popup-overlay{align-items:center;}
    .luxtify-popup-box{border-radius:14px;max-width:420px;}
  }
</style>
</head>
<body>
<div id="app">

<section id="luxtifySection">

  <div class="luxtify-header">
    <img class="luxtify-logo" src="luxtify-logo.jpg" alt="Luxtify">
    <h1 class="luxtify-wordmark">LUXTIFY</h1>
    <div class="luxtify-stats" id="luxtifyStats">…</div>
    <label class="luxtify-notif-toggle hidden" id="luxtifyNotifToggleWrap" style="align-items:center;justify-content:center;gap:8px;margin-top:8px;cursor:pointer;color:#8a7a5e;font-size:11px;">
      <input type="checkbox" id="luxtifyNotifToggle"> 🔔 Notifiche nuova musica
    </label>
  </div>

  <div class="luxtify-search">
    <span>🔍</span>
    <input type="text" id="luxtifySearchInput" placeholder="Cerca in Luxtify" style="flex:1;background:none;border:none;color:#e0d4b8;font-size:13px;outline:none;font-family:'Crimson Pro',serif;">
  </div>

  <div id="luxtifySearchResults" class="hidden"></div>

  <div id="luxtifyMainContent">

  <div class="luxtify-chips hidden" id="luxtifyGenreChips"></div>

  <div class="luxtify-section hidden">
    <div class="luxtify-section-title">Riprendi l'ascolto</div>
    <div class="luxtify-inline-card" id="luxtifyContinue"></div>
  </div>

  <div class="luxtify-section hidden">
    <div class="luxtify-section-title">Consigliata per oggi</div>
    <div class="luxtify-inline-card" id="luxtifyDailyPick"></div>
  </div>

  <div class="luxtify-section hidden" id="luxtifyMyPlaylistsSection">
    <div class="luxtify-section-title">Le mie playlist</div>
    <div class="luxtify-row" id="luxtifyMyPlaylistsRow"></div>
  </div>

  <div class="luxtify-section" id="luxtifyMixesSection">
    <div class="luxtify-section-title">I tuoi mix</div>
    <div class="luxtify-row" id="luxtifyMixesRow"></div>
  </div>

  <div class="luxtify-section">
    <div class="luxtify-section-title">Album</div>
    <div class="luxtify-row" id="luxtifyAlbumsRow"></div>
  </div>

  <div class="luxtify-section" id="luxtifyArtistsSection">
    <div class="luxtify-section-title">I tuoi artisti preferiti</div>
    <div class="luxtify-row" id="luxtifyArtistsRow"></div>
  </div>

  <div class="luxtify-section hidden" id="luxtifyCollabSection">
    <button type="button" id="btnOpenLuxSongPopup" style="display:flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(201,162,77,0.35);color:#c9a24d;border-radius:20px;padding:8px 16px;font-size:12px;cursor:pointer;">
      🎵 Aggiungi una canzone
    </button>
  </div>

  <div class="luxtify-popup-overlay hidden" id="luxSongPopup">
    <div class="luxtify-popup-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <span style="color:#c9a24d;font-size:13px;font-family:'Cinzel Decorative',serif;letter-spacing:0.04em;">NUOVA CANZONE</span>
        <button type="button" id="btnCloseLuxSongPopup" style="background:none;border:1px solid rgba(201,162,77,0.4);color:#c9a24d;border-radius:50%;width:26px;height:26px;cursor:pointer;">✕</button>
      </div>
      <input type="text" id="fLuxTitle" placeholder="Titolo canzone">
      <input type="text" id="fLuxArtist" placeholder="Artista (opzionale)">
      <input type="text" id="fLuxGenre" placeholder="Genere (opzionale)">
      <label style="font-size:11px;color:#8a7a5e;display:block;margin-bottom:2px;">Copertina (opzionale)</label>
      <input type="file" id="fLuxCover" accept="image/*">
      <label style="font-size:11px;color:#8a7a5e;display:block;margin-bottom:2px;">File audio (mp3) o video (mp4)</label>
      <input type="file" id="fLuxAudio" accept="audio/*,video/mp4">
      <button type="button" id="btnAddLuxtifySong" style="width:100%;background:#6e1423;color:#f0e4cd;border:none;border-radius:6px;padding:10px;font-size:13px;cursor:pointer;margin-top:4px;">Pubblica canzone</button>
      <div id="luxUploadStatus" style="color:#c9a24d;font-size:11px;margin-top:6px;"></div>
    </div>
  </div>

  <div class="luxtify-section">
    <div class="luxtify-section-title">Il creatore</div>
    <a href="index.html" style="text-decoration:none;" class="luxtify-inline-card">
      <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(150deg,#6e1423,#1a1420);flex-shrink:0;"></div>
      <div style="flex:1;min-width:0;">
        <div style="color:#f0e4cd;font-size:12px;font-weight:600;">Nox Morningstar</div>
        <div style="color:#8a7a5e;font-size:10px;">Fondatore · tutti i brani e le storie</div>
      </div>
    </a>
  </div>

  </div>

</section>

<div class="luxtify-minibar hidden" id="luxtifyMiniBar">
  <img id="luxtifyMiniCover" src="" alt="">
  <div class="luxtify-minibar-info">
    <div class="luxtify-minibar-title" id="luxtifyMiniTitle"></div>
    <div class="luxtify-minibar-artist" id="luxtifyMiniArtist"></div>
  </div>
  <button type="button" id="luxtifyMiniPlayPause">⏸</button>
</div>

<div class="luxtify-bottomnav">
  <button type="button" class="luxtify-navitem active" id="luxtifyNavHome">🏠<span>Home</span></button>
  <button type="button" class="luxtify-navitem" id="luxtifyNavSearch">🔍<span>Cerca</span></button>
  <button type="button" class="luxtify-navitem" id="luxtifyNavLibrary">📁<span>Libreria</span></button>
  <a href="index.html" class="luxtify-navitem" style="text-decoration:none;">📚<span>Fumetti</span></a>
</div>

</div>

<div id="chrome-modals-slot"></div>
<script>
  document.getElementById('btnOpenLuxSongPopup').addEventListener('click', function(){
    document.getElementById('luxSongPopup').classList.remove('hidden');
  });
  document.getElementById('btnCloseLuxSongPopup').addEventListener('click', function(){
    document.getElementById('luxSongPopup').classList.add('hidden');
  });
</script>
<link rel="preload" href="app.js" as="script">
<script src="qrcode-lib.js" defer></script>
<script src="loader.js" defer></script>
</body>
</html>
