<!DOCTYPE html>

<head>

<meta name="twitter:description" content="Le colonne sonore e i podcast di LUX COMICS &amp; MEDUSA COMICS.">
<meta name="twitter:image" content="https://noxmorningstar.com/luxtify-logo.jpg">
<link rel="icon" href="luxtify-favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="luxtify-favicon-16.png" sizes="16x16" type="image/png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap"></noscript>
<!-- style.css è iniettato da loader.js con la versione sempre aggiornata -->
<style>
  /* ============ LUXTIFY — layout "vetrina" ============
     I colori NON sono più scritti a mano: seguono il tema giorno/notte del sito (body.theme-light),
     così i titoli non spariscono più sullo sfondo chiaro.
     Telefono (<700px): colonna unica, barra in basso.
     iPad verticale (700–899px): striscia laterale con sole icone.
     iPad orizzontale / PC (≥900px): menu laterale con testo e lettore a tutta larghezza.
     Schermi larghi (≥1240px): in più il pannello "In riproduzione" a destra. */
  html body.lx-page{
    --lx-bg:#0b0607; --lx-card:#150c0d; --lx-card2:#1d1112; --lx-ink:#f0e4cd; --lx-dim:#a89a7c;
    --lx-line:rgba(201,162,77,0.25); --lx-gold:#c9a24d; --lx-goldb:#e3c273; --lx-wine:#6e1423; --lx-tab:#150d0e;
    margin:0; min-height:100vh; color:var(--lx-ink);
    background:radial-gradient(ellipse 900px 500px at 50% 0%,rgba(110,20,35,0.22),transparent 70%),var(--lx-bg);
  }
  html body.lx-page.theme-light{
    --lx-bg:#f4efe2; --lx-card:#ffffff; --lx-card2:#efe7d3; --lx-ink:#2a1d12; --lx-dim:#6a5b44;
    --lx-line:rgba(138,106,31,0.35); --lx-gold:#8a6a1f; --lx-goldb:#6b5015; --lx-wine:#8a1a2c; --lx-tab:#150d0e;
    background:radial-gradient(ellipse 900px 500px at 50% 0%,rgba(224,122,95,0.16),transparent 70%),var(--lx-bg);
  }
  .hidden{display:none !important;}

  /* le sezioni scritte dal codice con colori fissi (playlist, mix, artisti, ricerca) seguono comunque il tema */
  #luxtifySection [style*="#f0e4cd"], #luxtifySection [style*="#e0d4b8"]{color:var(--lx-ink) !important;}
  #luxtifySection [style*="#8a7a5e"]{color:var(--lx-dim) !important;}
  #luxtifySection [style*="#c9a24d"]{color:var(--lx-gold) !important;}
  #luxtifySection [style*="background:#150d0e"]{background:var(--lx-card) !important;}

  #luxtifySection{max-width:none;margin:0;font-family:'Crimson Pro',serif;padding-bottom:150px;}

  /* ---- intestazione ---- */
  .lx-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px;}
  .lx-brandrow{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
  .lx-logo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--lx-gold);flex:none;}
  .luxtify-wordmark{
    font-family:'Cinzel Decorative',serif;font-size:24px;letter-spacing:0.06em;margin:0;line-height:1.1;
    background:linear-gradient(90deg,#c9a24d,#e85d4a,#4a9eff,#c9a24d);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:luxtifyShift 6s ease-in-out infinite;
  }
  @keyframes luxtifyShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  @media (prefers-reduced-motion:reduce){.luxtify-wordmark{animation:none;}}
  .luxtify-stats{color:var(--lx-dim);font-size:11px;margin-top:2px;font-family:'Space Mono',monospace;}
  .lx-tools{display:flex;align-items:center;gap:8px;flex:none;}
  .lx-iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--lx-line);background:var(--lx-card);color:var(--lx-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .lx-iconbtn:hover{border-color:var(--lx-gold);color:var(--lx-goldb);}
  .lx-ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .lx-adult{display:flex;align-items:center;gap:7px;border:1px solid var(--lx-line);border-radius:20px;padding:5px 7px 5px 12px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.04em;background:var(--lx-card);color:var(--lx-ink);cursor:pointer;}
  .lx-adult .sw{width:36px;height:20px;border-radius:12px;background:#4a3c3c;position:relative;transition:background .15s;flex:none;}
  .lx-adult .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;}
  .lx-adult[aria-pressed="true"]{border-color:var(--lx-gold);}
  .lx-adult[aria-pressed="true"] .sw{background:linear-gradient(90deg,#e07a5f,#5dcaa5);}
  .lx-adult[aria-pressed="true"] .sw::after{transform:translateX(16px);}
  .luxtify-search{order:3;flex:1 1 100%;margin:0;display:flex;align-items:center;gap:10px;background:var(--lx-card);border:1px solid var(--lx-line);border-radius:24px;padding:10px 16px;cursor:text;color:var(--lx-dim);}
  .luxtify-search input{flex:1;min-width:0;background:none;border:none;color:var(--lx-ink);font-size:16px;outline:none;font-family:'Crimson Pro',serif;}
  .luxtify-search input::placeholder{color:var(--lx-dim);}
  .luxtify-notif-toggle{order:4;flex:1 1 100%;display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--lx-dim);font-size:12px;font-family:'Space Mono',monospace;}
  .luxtify-notif-toggle input{accent-color:var(--lx-gold);width:16px;height:16px;}

  /* ---- filtri per genere ---- */
  .luxtify-chips{display:flex;gap:8px;padding:6px 16px 4px;overflow-x:auto;scrollbar-width:none;}
  .luxtify-chips::-webkit-scrollbar{display:none;}
  .luxtify-chip{flex:none;border:1px solid var(--lx-line);color:var(--lx-dim);background:var(--lx-card);border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap;font-family:'Crimson Pro',serif;}
  .luxtify-chip:hover{border-color:var(--lx-gold);}
  .luxtify-chip.active{border-color:var(--lx-gold);color:var(--lx-goldb);background:rgba(201,162,77,0.12);font-weight:600;}

  /* ---- sezioni e righe ---- */
  .luxtify-section{padding:14px 16px 8px;}
  .luxtify-section-title{color:var(--lx-dim);font-size:10.5px;text-transform:uppercase;letter-spacing:0.14em;margin-bottom:10px;font-weight:400;font-family:'Space Mono',monospace;}
  .luxtify-section-title b{color:var(--lx-goldb);font-weight:400;}
  .luxtify-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  .luxtify-row::-webkit-scrollbar{display:none;}
  .luxtify-inline-card{display:flex;align-items:center;gap:12px;background:var(--lx-card);border:1px solid var(--lx-line);border-radius:12px;padding:10px;cursor:pointer;}
  .luxtify-inline-card:hover{border-color:var(--lx-gold);}

  /* ---- copertine, brani, album ---- */
  .lx-cvwrap{position:relative;overflow:hidden;border-radius:8px;flex:none;background:var(--lx-card2);}
  .lx-cov{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:1/1;}
  .lx-lock .lx-cov{filter:blur(9px) saturate(0.6);transform:scale(1.15);}
  .lx-lockov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;background:rgba(10,6,8,0.45);color:#fff;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;}
  .lx-lockov .lx-ico{width:18px;height:18px;}
  .lx-tag{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.04em;border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:14px;color:var(--lx-dim);display:inline-block;vertical-align:middle;}
  .lx-card{width:112px;flex:none;text-align:left;cursor:pointer;}
  .lx-card .lx-cvwrap{width:112px;height:112px;margin-bottom:6px;}
  .lx-card-title{font-size:14px;font-weight:600;line-height:1.25;max-height:2.5em;overflow:hidden;color:var(--lx-ink);}
  .lx-card-sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--lx-dim);}
  .lx-heart{width:112px;height:112px;border-radius:8px;background:linear-gradient(150deg,var(--lx-wine),#0b0607);display:flex;align-items:center;justify-content:center;margin-bottom:6px;color:#fff;}
  .lx-tracks{display:block;}
  .lx-trow{display:flex;gap:12px;align-items:center;background:var(--lx-card);border:1px solid var(--lx-line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;}
  .lx-trow:hover{border-color:var(--lx-gold);}
  .lx-trow .lx-cvwrap{width:50px;height:50px;}
  .lx-trow-main{flex:1;min-width:0;}
  .lx-trow-title{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--lx-ink);}
  .lx-trow-sub{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--lx-dim);}
  .lx-num{font-family:'Space Mono',monospace;color:var(--lx-dim);width:22px;text-align:center;font-size:12px;flex:none;}
  .lx-play{width:38px;height:38px;border-radius:50%;background:var(--lx-wine);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;cursor:pointer;}

  /* ---- in evidenza ---- */
  .lx-hero{position:relative;margin:8px 16px 6px;border-radius:18px;overflow:hidden;border:1px solid var(--lx-line);min-height:210px;display:flex;align-items:flex-end;cursor:pointer;background:var(--lx-card2);}
  .lx-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .lx-hero-img.lx-blur{filter:blur(10px) saturate(0.6);transform:scale(1.1);}
  .lx-hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.05),rgba(0,0,0,0.8));}
  .lx-hero-txt{position:relative;padding:18px;color:#fff;width:100%;display:flex;align-items:flex-end;gap:12px;}
  .lx-hero-kicker{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.08em;opacity:0.9;}
  .lx-hero-title{font-family:'Cinzel',serif;font-size:22px;line-height:1.15;display:block;margin:2px 0;}
  .lx-hero-artist{font-family:'Space Mono',monospace;font-size:11px;opacity:0.85;}
  .lx-hero .lx-play{width:48px;height:48px;font-size:17px;background:#fff;color:#150d0e;margin-left:auto;}
  .lx-hero .lx-tag{color:#fff;}

  /* ---- carica canzone ---- */
  .luxtify-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:400;display:flex;align-items:flex-end;justify-content:center;}
  .luxtify-popup-box{background:var(--lx-card);border:1px solid var(--lx-line);border-radius:14px 14px 0 0;padding:20px;width:100%;max-width:520px;box-sizing:border-box;color:var(--lx-ink);}
  .luxtify-popup-box input[type="text"]{width:100%;box-sizing:border-box;margin-bottom:8px;background:var(--lx-bg);border:1px solid var(--lx-line);border-radius:6px;color:var(--lx-ink);padding:10px;font-size:16px;}
  .luxtify-popup-box input[type="file"]{width:100%;margin-bottom:8px;font-size:12px;color:var(--lx-dim);}
  .lx-popup-label{font-size:11px;color:var(--lx-dim);display:block;margin-bottom:2px;}
  .lx-explicit-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--lx-ink);margin:8px 0 10px;cursor:pointer;}
  .lx-explicit-check input{accent-color:var(--lx-gold);width:18px;height:18px;}
  .lx-ghostbtn{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--lx-line);color:var(--lx-gold);border-radius:20px;padding:8px 16px;font-size:13px;cursor:pointer;}

  /* ---- barra in basso (telefono) ---- */
  .luxtify-bottomnav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid rgba(201,162,77,0.25);background:var(--lx-tab);z-index:60;}
  .luxtify-navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8f8470;font-size:0;line-height:1;cursor:pointer;background:none;border:none;padding:6px 4px;text-decoration:none;font-family:'Space Mono',monospace;}
  .luxtify-navitem span{font-size:10px;}
  .luxtify-navitem .lx-ico{width:22px;height:22px;}
  .luxtify-navitem.active{color:#e3c273;}
  .luxtify-navitem:hover{color:#e3c273;}

  /* ---- lettore (mini) ---- */
  .luxtify-minibar{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));margin:0;display:flex;align-items:center;gap:10px;background:var(--lx-card2);border:1px solid var(--lx-line);border-radius:14px;padding:8px 12px;cursor:pointer;z-index:50;}
  .luxtify-minibar img{width:38px;height:38px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--lx-card);}
  .luxtify-minibar-info{flex:1;min-width:0;}
  .luxtify-minibar-title{color:var(--lx-ink);font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .luxtify-minibar-artist{color:var(--lx-dim);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Space Mono',monospace;}
  .luxtify-minibar button{background:var(--lx-wine);border:none;color:#fff;font-size:14px;flex-shrink:0;cursor:pointer;width:34px;height:34px;border-radius:50%;}

  /* ---- pannello "In riproduzione" (solo schermi larghi) ---- */
  .lx-now{display:none;}

  /* ============ da iPad in su: intestazione su una riga, filtri a capo, album in griglia, brani su due colonne ============ */
  @media (min-width: 700px){
    #luxtifySection{padding-bottom:110px;}
    .lx-head{flex-wrap:wrap;gap:12px 18px;padding:22px 28px 8px;}
    .lx-brandrow{flex:none;}
    .luxtify-search{order:2;flex:1;max-width:520px;margin:0 auto 0 0;}
    .lx-tools{order:3;}
    .luxtify-chips{padding:8px 28px 4px;flex-wrap:wrap;overflow:visible;}
    .luxtify-section{padding:16px 28px 8px;}
    .luxtify-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));overflow:visible;gap:16px 14px;}
    .lx-card{width:auto;}
    .lx-card .lx-cvwrap,.lx-heart{width:100%;height:auto;aspect-ratio:1/1;}
    .lx-tracks{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
    .lx-hero{margin:10px 28px 6px;min-height:260px;}
    .luxtify-inline-card{max-width:520px;}
    .luxtify-popup-overlay{align-items:center;}
    .luxtify-popup-box{border-radius:14px;max-width:440px;}
  }
  /* iPad verticale: striscia laterale a sole icone */
  @media (min-width: 700px) and (max-width: 899.98px){
    .luxtify-bottomnav{top:0;right:auto;bottom:0;width:76px;flex-direction:column;justify-content:flex-start;align-items:center;gap:6px;padding:20px 6px;border-top:none;border-right:1px solid rgba(201,162,77,0.25);}
    .luxtify-navitem{flex:none;width:56px;padding:10px 0;border-radius:12px;}
    .luxtify-navitem span{display:none;}
    .luxtify-navitem.active{background:rgba(201,162,77,0.14);}
    #luxtifySection{margin-left:76px;}
    .luxtify-minibar{left:84px;}
  }
  /* iPad orizzontale e PC: menu laterale con testo, lettore a tutta larghezza in basso */
  @media (min-width: 900px){
    .luxtify-bottomnav{top:0;right:auto;bottom:0;width:230px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:6px;padding:24px 12px 90px;border-top:none;border-right:1px solid rgba(201,162,77,0.2);background:var(--lx-tab);box-sizing:border-box;overflow-y:auto;}
    .luxtify-navitem{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:11px 14px;border-radius:8px;width:100%;box-sizing:border-box;}
    .luxtify-navitem span{font-size:14px;}
    .luxtify-navitem .lx-ico{width:20px;height:20px;}
    .luxtify-navitem.active{background:rgba(201,162,77,0.14);}
    #luxtifySection{margin-left:230px;}
    .lx-head{padding:26px 36px 8px;}
    .luxtify-chips{padding:8px 36px 4px;}
    .luxtify-section{padding:18px 36px 10px;}
    .lx-hero{margin:12px 36px 6px;min-height:300px;}
    .luxtify-minibar{left:230px;right:0;bottom:0;border-radius:0;border-width:1px 0 0 0;padding:12px 36px;}
    .luxtify-minibar img{width:44px;height:44px;}
  }
  /* schermi larghi: pannello a destra con il brano in ascolto */
  @media (min-width: 1240px){
    #luxtifySection{margin-right:300px;}
    .lx-now{display:block;position:fixed;top:0;right:0;bottom:70px;width:300px;padding:22px 20px;border-left:1px solid var(--lx-line);background:var(--lx-card);overflow-y:auto;z-index:40;box-sizing:border-box;}
    .lx-now h3{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--lx-dim);font-weight:400;margin:0 0 10px;}
    .lx-now-big{width:100%;aspect-ratio:1/1;border-radius:12px;margin-bottom:12px;}
    .lx-now-title{font-family:'Cinzel',serif;font-size:20px;line-height:1.2;color:var(--lx-ink);display:block;}
    .lx-now-artist{font-family:'Space Mono',monospace;font-size:11px;color:var(--lx-dim);}
    .lx-now .lx-trow{padding:8px;}
    .lx-now .lx-trow .lx-cvwrap{width:38px;height:38px;}
    .lx-now .lx-trow-title{font-size:14px;}
    .lx-now-empty{color:var(--lx-dim);font-size:15px;}
  }
</style>
</head>
<body class="lx-page">
<div id="app">

<section id="luxtifySection">

  <header class="lx-head">
    <div class="lx-brandrow">
      <img class="lx-logo" src="luxtify-logo.jpg" alt="Luxtify">
      <div>
        <h1 class="luxtify-wordmark">LUXTIFY</h1>
        <div class="luxtify-stats" id="luxtifyStats">…</div>
      </div>
    </div>
    <div class="lx-tools">
      <button type="button" class="lx-iconbtn" id="btnTheme" aria-label="Cambia tema" title="Giorno / Notte">
        <svg id="themeIconMoon" class="lx-ico" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        <svg id="themeIconSun" class="lx-ico hidden" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
      </button>
      <button type="button" class="lx-adult" id="luxtifyAdultToggle" aria-pressed="false" aria-label="Mostra i brani 18+">18+<span class="sw"></span></button>
    </div>
    <label class="luxtify-notif-toggle hidden" id="luxtifyNotifToggleWrap">
      <input type="checkbox" id="luxtifyNotifToggle"> Notifiche nuova musica
    </label>
    <div class="luxtify-search">
      <svg class="lx-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="text" id="luxtifySearchInput" placeholder="Cerca in Luxtify" autocomplete="off" aria-label="Cerca in Luxtify">
    </div>
  </header>

  <div id="luxtifySearchResults" class="hidden"></div>

  <div id="luxtifyMainContent">

  <div class="luxtify-chips hidden" id="luxtifyGenreChips"></div>

  <div class="lx-hero hidden" id="luxtifyDailyPick"></div>

  <div class="luxtify-section hidden">
