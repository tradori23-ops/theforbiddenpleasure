<style>
  #guideSection{max-width:720px;margin:0 auto;padding:34px 20px 60px;}
  .guide-toc{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin:20px 0 26px;-webkit-overflow-scrolling:touch;}
  .guide-toc button{flex:none;border:1px solid var(--line);border-radius:16px;padding:7px 13px;font-family:'Space Mono',monospace;font-size:10.5px;color:var(--parchment-dim);white-space:nowrap;background:none;cursor:pointer;}
  .guide-toc button.on{background:var(--gold);color:#150d0e;font-weight:700;border-color:var(--gold);}
  .guide-sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .guide-sec-icon{width:36px;height:36px;border-radius:8px;background:var(--void-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
  .guide-sec-head h3{font-family:'Cinzel',serif;font-size:19px;color:var(--parchment);}
  .guide-step{display:flex;gap:12px;margin:16px 0;}
  .guide-step .n{width:23px;height:23px;border-radius:50%;background:var(--void-2);border:1px solid var(--line);color:var(--gold-bright);font-family:'Space Mono',monospace;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;}
  .guide-step .t b{display:block;font-size:14.5px;color:var(--parchment);margin-bottom:2px;}
  .guide-step .t p{color:var(--parchment-dim);font-size:14px;line-height:1.6;}
  .guide-progress{display:flex;gap:6px;margin:22px 0 4px;}
  .guide-progress .dot{flex:1;height:3px;border-radius:2px;background:var(--line);}
  .guide-progress .dot.done{background:var(--gold);}
  .guide-nav-btns{display:flex;justify-content:space-between;margin-top:8px;}
  .guide-nav-btns button{border:1px solid var(--line);border-radius:20px;padding:8px 15px;font-family:'Space Mono',monospace;font-size:11px;color:var(--parchment-dim);background:none;cursor:pointer;}
  .guide-nav-btns button:hover:not(:disabled){border-color:var(--gold);color:var(--gold-bright);}
  .guide-nav-btns button:disabled{opacity:0.3;cursor:default;}
</style>
