<style>
  #faqSection{max-width:720px;margin:0 auto;padding:34px 20px 60px;}
  .faq-search{width:100%;margin:6px 0 24px;padding:12px 16px;border-radius:20px;border:1px solid var(--line);background:var(--void-2);color:var(--parchment);font-family:'Crimson Pro',serif;font-size:15px;}
  .faq-groups{display:flex;flex-direction:column;gap:28px;}
  .faq-group-title{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .faq-item{border-bottom:1px solid var(--line);}
  .faq-q{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 2px;background:none;border:0;color:var(--parchment);font-family:'Cinzel',serif;font-size:15.5px;cursor:pointer;}
  .faq-q .x{color:var(--gold);font-size:18px;flex:none;transition:transform .15s;}
  .faq-item.open .faq-q .x{transform:rotate(45deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .2s ease;color:var(--parchment-dim);font-size:14.5px;line-height:1.6;padding:0 2px;}
  .faq-item.open .faq-a{max-height:400px;padding-bottom:16px;}
  .faq-empty{color:var(--parchment-dim);font-size:14px;margin-top:10px;}
  .faq-contact{margin-top:34px;border:1px solid var(--line);border-radius:8px;padding:18px 20px;background:var(--void-2);font-size:14px;color:var(--parchment-dim);}
  .faq-contact a{color:var(--gold-bright);}
</style>
</head>

<div id="app">
<div id="chrome-top-slot"></div>

  <section class="section ornate-divider" id="faqSection">
    <div class="section-head">
      <div class="section-eyebrow">Assistenza</div>
      <h2>Domande frequenti</h2>
      <p class="section-desc">Le domande più comuni su account, spunta blu, titoli e Luxtify.</p>
    </div>
    <input type="text" class="faq-search" id="faqSearch" placeholder="Cerca una domanda…" autocomplete="off">
    <div class="faq-groups" id="faqGroups"></div>
    <p class="faq-empty hidden" id="faqEmpty">Nessuna domanda corrisponde alla ricerca.</p>
    <div class="faq-contact">Non hai trovato risposta? Scrivi da <a href="community.html#communitySection">Community</a> oppure lascia una richiesta dal tuo <a href="profile.html">profilo</a>.</div>
  </section>
