<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LUX COMICS &amp; MEDUSA COMICS — Chat</title>
<meta name="theme-color" content="#6e1423">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap"></noscript>
<link rel="stylesheet" href="style.css?v=6">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app">
<div id="chrome-top-slot"></div>

  <section class="section" id="chatSection">
    <div id="chatNotFound" class="hidden">
      <p class="form-note" data-i18n="chat.notFound">Apri questa pagina da un profilo o dal pannello Utenti.</p>
    </div>

    <div id="chatBox" class="chat-page hidden">
      <div class="chat-sidebar" id="chatSidebar">
        <div class="chat-sidebar-header">
          <a href="index.html" class="chat-sidebar-home" aria-label="Torna al sito" title="Torna al sito">←</a>
          <span data-i18n="community.tabDms">Messaggi privati</span>
        </div>
        <div class="chat-sidebar-list" id="chatSidebarList"></div>
      </div>

      <div class="chat-conversation">
        <div class="chat-page-header">
          <button type="button" class="chat-back" id="btnChatBack" aria-label="Indietro">←</button>
          <span class="chat-header-avatar-wrap">
            <img id="chatOtherAvatar" class="chat-header-avatar" src="" alt="">
            <span id="chatOtherDot" class="chat-header-dot offline"></span>
          </span>
          <div class="chat-header-info">
            <div id="chatOtherName" class="chat-header-name">—</div>
            <div id="chatOtherStatus" class="chat-header-status"></div>
          </div>
          <button type="button" class="chat-icon-btn chat-header-action" id="btnChatBg" aria-label="Sfondo chat" title="Sfondo chat">🖼️</button>
        </div>

        <div id="chatBgPanel" class="chat-bg-panel hidden">
          <div class="chat-bg-swatches" id="chatBgSwatches"></div>
          <label class="btn btn-ghost btn-sm chat-bg-upload-label" for="fChatBgUpload">Carica immagine…</label>
          <input type="file" id="fChatBgUpload" accept="image/*" class="hidden">
          <button type="button" class="btn btn-ghost btn-sm" id="btnChatBgReset">Rimuovi sfondo</button>
        </div>

        <div id="chatMessages" class="chat-page-messages"></div>

        <div class="chat-page-composer">
          <div id="chatAttachPreview" class="chat-attach-preview hidden">
            <span id="chatAttachName"></span>
            <button type="button" id="btnChatAttachRemove" aria-label="Rimuovi allegato">×</button>
          </div>
          <div class="form-error" id="chatMessageError"></div>
          <div class="chat-composer-row">
            <label class="chat-icon-btn" for="fChatAttachment" aria-label="Allega file o immagine">📎</label>
            <input type="file" id="fChatAttachment" accept="image/*,.pdf,.doc,.docx" class="hidden">
            <input type="text" id="fChatMessage" class="chat-text-input" data-i18n-placeholder="chat.messagePlaceholder" placeholder="Scrivi un messaggio…">
            <button type="button" class="btn btn-primary btn-sm" id="btnSendChat" data-i18n="community.send">Invia</button>
          </div>
        </div>
      </div>
    </div>
  </section>

<div id="chrome-footer-slot"></div>
</div>
<div id="chrome-modals-slot"></div>
<link rel="preload" href="app.js?v=6" as="script">
<script src="loader.js" defer></script>
</body>
</html>
