</main>
<script>
(function(){
  var P = 'https://www.patreon.com/noxmorningstar?utm_campaign=creatorshare_creator';
  var SB = 'https://ukafvwyxdjsfzzoewujq.supabase.co', KEY = 'sb_publishable_-jO_WGzMVo-3Xp5J75RwiA__u49YnPr';
  if(!/^it\b/i.test(navigator.language || 'it')){
    document.documentElement.lang = 'en';
    document.getElementById('msg').textContent = 'Taking you to Patreon…';
    document.getElementById('go').textContent = 'Open Patreon';
  }
  var gone = false;
  function go(){ if(gone) return; gone = true; try { window.location.replace(P); } catch(e){ window.location.href = P; } }
  var wait = null;
  try {
    var c = String(new URLSearchParams(window.location.search).get('da') || '').trim().toLowerCase();
    var bot = /bot|crawl|spider|slurp|headless|lighthouse|bingpreview|facebookexternalhit|embedly/i.test(navigator.userAgent || '');
    var admin = false, marks = {};
    try { admin = localStorage.getItem('lux_admin_device') === '1'; marks = JSON.parse(localStorage.getItem('lux_promo_marks') || '{}') || {}; } catch(e){}
    if(/^[a-z0-9][a-z0-9-]{1,39}$/.test(c) && !bot && !admin && !((marks[c] || 0) & 1)){
      // (come nel sito: ogni telefono o computer conta una volta sola per link)
      marks[c] = (marks[c] || 0) | 1;
      var keys = Object.keys(marks);
      if(keys.length > 200) keys.slice(0, keys.length - 200).forEach(function(k){ delete marks[k]; });
      try { localStorage.setItem('lux_promo_marks', JSON.stringify(marks)); } catch(e){}
      wait = fetch(SB + '/rest/v1/rpc/count_promo_link', {
        method: 'POST', keepalive: true,
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_code: c, p_what: 'open' })
      }).catch(function(){});
    }
  } catch(e){}
  // si aspetta che il conteggio parta (al massimo un attimo), poi via
  if(wait){ wait.then(go, go); setTimeout(go, 900); } else go();
})();
</script>
